# Shadowrocket: 2026-11-10 统一双订阅版 v6.8（同频）
# 2026-11-10 Muse v6.8：metaaivm.com 由 Meta-US 改回日本自动。实测：v6.5 将该域名移入美国组后，两台手机在家庭 WiFi 下均无法连接 Muse（5G 正常、其他应用正常）——家宽到美国组入口的路径当晚已劣化，美国长程链路先死；该域名在 v6.5 前走 FINAL 日本自动时全晚正常。故 Muse 通道回归日本自动，美国组只留 Google/Meta 业务域名。其余与 v6.7 一致。
# 2026-11-10 Muse v6.7 紧急修正：v6.5 起 DNS 强制单一 alidns#h3 后，两台手机均出现「WiFi 全断、5G 正常」——#h3 走 QUIC/UDP，家宽/路由器这段路不通且单上游无回退，等于全网解析瘫痪。故 DNS 回退 v6.4 口径：alidns DoH + doh.pub 双上游、协议由客户端按网络自适应，不再强制 #h3。其余与 v6.6 完全一致（metaaivm.com 归 Meta-US、免费节点全排除等）。
# 2026-11-10 Muse v6.6：马坤指示——免费节点全部剔除、不可用。订阅自带的节点配置层删不掉，但已给全部地区自动组（日本/全球/香港/新加坡/美国）加 (?!.*免费) 排除，任何自动组与规则流量都选不到免费节点；Google-US/Meta-US 的「美国Z」正则本就不匹配免费命名。首页节点列表里仍会显示免费节点，别手动点即可。
# 2026-11-10 Muse v6.5：采纳另一 Muse 对第二台手机日志（18:50–01:06）的分析并经总控日志交叉验证——
# ① 新增 DOMAIN-SUFFIX,metaaivm.com,Meta-US：Muse 实时通道域名此前无规则、走 FINAL 在日本节点间跳（对方日志见 Z01/Z07/免费节点轮换、几秒内反复重连），长连接因此频断；现与 meta.ai 同组（Meta-US＝Z01/Z02 自动），不再乱跳。
# ② 日本自动/全球自动 正则加 (?!.*免费) 排除免费节点：免费节点混在「日本」正则里被自动组选中过，稳定性最差，剔除；导入后请瞄一眼日本自动组成员数，确认免费节点已消失、组不为空。
# ③ DNS 收敛为单一上游 https://dns.alidns.com/dns-query#h3：双上游对同一域名返回不同 IP（CDN 调度）使连接落点漂移、doh.pub 曾返回空、普通版 alidns 曾卡死 182s；#h3 在两边日志中均最稳（零超时）。代价：单上游无备份，若出现解析全断，把 dns-server 改回「https://dns.alidns.com/dns-query, https://doh.pub/dns-query」即恢复 v6.4 状态。
# 2026-11-10 Muse v6.4：马坤指示——Meta 改同 Google 口径，不再钉死 Z02，改为 Z01/Z02 双节点自动切换（组名随之由 Meta-Z02 改为 Meta-US，成员正则与 Google-US 相同：只认 iKuuu 美国Z 系）。稳定性优先于单点地点；两节点均为美国出口，Meta 设备地点可能在两节点各自的登记城市间交替出现，属预期。v6.2 的钉死设定自此作废。
# 2026-11-10 Muse v6.3：实证修复单点钉死——原模板遗留 381 条规则（lbkrs.com 长桥行情、openai.com、chatgpt.com、claude.ai、anthropic.com、Telegram 等）指向内置 PROXY 组，该组=首页手动选中的单个节点（今晚为日本Z02），无自动切换；2026-11-09 夜 Z02 线路波动直接传导为长桥行情刷不出、Muse 语音输入失败等单 App 故障。现 381 条全部改挂「日本自动」自动组（双订阅全部日本节点 url-test 竞速、单点坏了自动换），首页选哪个节点从此不再影响任何规则流量。Meta-Z02 钉死组与 Google-US 专用组为马坤有意设定，不在此列。
# 2026-11-09 Muse v6.2：马坤指示——Meta 系钉死美国 Z02。他看 Meta 账号登录设备列表，同一台手机被记成广州/深圳/美国俄勒冈多地，原因是出口随分流漂移；Meta 只按出口 IP 查定位库。此版新增专用组 Meta-Z02（成员正则只认 iKuuu 美国 Z02 一个节点，url-test 单成员、无回退到 Z01/日本/直连），并在 [Rule] 前部（Apple 直连之后、Google 规则之前）新增 Meta 系域名 + Meta ASN 主要 IP 段规则全部指向该组，压过后文 WhatsApp 等泛 PROXY 规则。代价写明：Z02 挂了 Meta 系就打不开、不会悄悄换出口漂地点——这是钉死本身的含义，要的正是地点不再乱。范围：facebook/instagram/threads/messenger/meta/oculus/whatsapp 全系。
