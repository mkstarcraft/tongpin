# 2026-11-09 Muse v6：依据 2026-11-08/09 四份 Shadowrocket 日志（代理 2,556 条 + DNS 24,652 条）实证优化：
# ① Google-US/美国自动/全球自动 的美国成员收紧为仅 iKuuu（美国Z01/Z02）——一元「美国 01–04」四个节点实测全部解析到同一香港 IP 157.254.23.66（us1–us4 只是同机别名），留在组里会被自动测速选上、出口变香港；一元日本线实测为东京真节点，不受影响。
# ② [Rule] 顶部新增私有网段/Tailscale(100.64.0.0/10) IP-CIDR 直连：bypass-tun 虽已含 100.64/10，日志仍见 100.139.x 流量被 FINAL 送日本节点，规则层再钉一条双保险。
