[Proxy Group]
# ===== 双供应商子池＋故障转移（v9.0，与 Mac 端 Clash 2026-11-13 定版对齐）=====
# 结构：两家供应商各成一个 fallback 子池，上层「日本自动」在两池之间故障转移，
# 「🛡 Muse专线」再钉两家各自的首选节点＋两池兜底，与 Mac 端 Script.js 的组结构一一对应。
# 子池归类按节点名（与订阅里的真实命名核对过）：
#   iKuuu ＝「日本Z<数字>」Z 系 IEPL（🇯🇵 日本Z02 | IEPL）；一元 ＝「日本 <数字> | 高级专线」（🇯🇵日本 02 | 高级专线）。
#   两池均排除免费节点（免费-日本*）与下载专用节点（日本Z05/Z06 | 下载专用 | x0.01）。
# 探测（全部新组统一）：经成员出口请求 https://www.gstatic.com/generate_204，要求完整 TLS 握手＋204 响应，
# interval=60 秒、timeout=5 秒、无流量时也持续探测——专为识别「TCP 通、TLS 握手被掐」的半死节点；
# fallback 语义＝按成员顺序用第一个活着的出口，整池判死才切下一成员，与旧版 url-test 混池竞速不同。
# 用法不变：小火箭首页不列出配置内的组；[Rule] 的 FINAL 仍指「日本自动」，导入启用后无需在首页选任何节点。
🇯🇵 iKuuu自动 = fallback,policy-regex-filter=(?i)(?!.*免费)(?!.*下载)日本Z[0-9],url=https://www.gstatic.com/generate_204,interval=60,timeout=5
🇯🇵 一元自动 = fallback,policy-regex-filter=(?i)(?!.*免费)(?!.*下载)日本 [0-9],url=https://www.gstatic.com/generate_204,interval=60,timeout=5
# 日常默认出口（[Rule] 的 FINAL,日本自动 直指本组）：iKuuu 池优先、整池死切一元池（顺序与 Mac 端一致）。
日本自动 = fallback,🇯🇵 iKuuu自动,🇯🇵 一元自动,url=https://www.gstatic.com/generate_204,interval=60,timeout=5
# Muse 专线：成员跨两家排列——两家首选节点在前、两家子池在后兜底；供 [Rule] 里 meta.ai / meta.com 两条规则使用。
# 注：专线组的两个钉选成员按订阅里的节点全名引用；若某家改名/下架该节点，该成员自动缺席、由后面子池兜底，组不会空。
🛡 Muse专线 = fallback,🇯🇵 日本Z02 | IEPL,🇯🇵日本 02 | 高级专线,🇯🇵 iKuuu自动,🇯🇵 一元自动,url=https://www.gstatic.com/generate_204,interval=60,timeout=5
# 备用地区组（需要时在首页点选即可，成员均为双订阅同名地区节点自动竞速）。
香港自动 = url-test,policy-regex-filter=(?i)(?!.*免费)香港,url=http://www.gstatic.com/generate_204,interval=600,timeout=5,tolerance=150
新加坡自动 = url-test,policy-regex-filter=(?i)(?!.*免费)新加坡,url=http://www.gstatic.com/generate_204,interval=600,timeout=5,tolerance=150
# 兜底组：双订阅全部海外节点一起竞速，某地区整片出问题时点选此组。
全球自动 = url-test,policy-regex-filter=(?i)(?!.*免费)(日本|香港|新加坡|台湾|英国|韩国|德国|法国|加拿大|土耳其|俄罗斯|阿根廷|澳洲|澳大利亚),url=http://www.gstatic.com/generate_204,interval=600,timeout=5,tolerance=200

